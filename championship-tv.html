<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Howick Rifle Club - Championship TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050607;
      --line: #27343a;
      --text: #f3f8fb;
      --muted: #9bb0bb;
      --accent: #ff7a00;
      --accent-soft: #3a2409;
      --warn: #ffcc70;
      --gold: #ffd479;
      --silver: #d6e2ea;
      --bronze: #e0a878;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 10% 0%, #1a1815 0%, transparent 35%),
        radial-gradient(circle at 90% 8%, #241606 0%, transparent 32%),
        var(--bg);
      color: var(--text);
      font-family: "Rajdhani", "Segoe UI", sans-serif;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
    }

    .app {
      padding: 1rem 1.4rem 0.7rem;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 0.7rem;
      min-height: 0;
    }

    .top-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1.2rem;
      border-bottom: 1px solid var(--line);
      padding-bottom: 0.6rem;
    }

    .club-brand img {
      width: min(26vw, 300px);
      max-height: 68px;
      object-fit: contain;
      display: block;
    }

    .event-identity { min-width: 0; }

    .event-title {
      font-family: "Oswald", sans-serif;
      font-size: clamp(1.5rem, 2.35vw, 2.5rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-format {
      font-size: clamp(0.95rem, 1.2vw, 1.3rem);
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 0.12rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      text-align: right;
      font-size: clamp(0.85rem, 1.05vw, 1.1rem);
      color: var(--muted);
      line-height: 1.3;
      white-space: nowrap;
    }

    .state-badge {
      display: inline-block;
      font-family: "Oswald", sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: clamp(0.8rem, 1vw, 1.05rem);
      padding: 0.12rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: #ffcf9e;
    }

    .status .warning {
      color: var(--warn);
      font-weight: 700;
      display: none;
      margin-top: 0.15rem;
    }

    .view-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 1rem;
      border-left: 4px solid var(--accent);
      padding: 0.3rem 0.7rem;
      background: linear-gradient(90deg, #171310 0%, #0f1215 70%);
      border-radius: 4px;
    }

    .view-title {
      font-family: "Oswald", sans-serif;
      font-size: clamp(1.15rem, 1.7vw, 1.85rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .view-meta {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      color: var(--muted);
      font-family: "Oswald", sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: clamp(0.85rem, 1.05vw, 1.1rem);
      white-space: nowrap;
    }

    .dots { display: flex; gap: 0.28rem; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #33403f;
    }

    .dot.on { background: var(--accent); }

    .board {
      background: linear-gradient(180deg, #12181c 0%, #0f1518 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      min-height: 0;
      display: grid;
      grid-template-rows: 1fr;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead th {
      text-transform: uppercase;
      font-family: "Oswald", sans-serif;
      letter-spacing: 0.08em;
      font-size: clamp(0.8rem, 1.05vw, 1.15rem);
      background: #1a1b18;
      color: #e7d3bd;
      border-bottom: 1px solid #3a3128;
      padding: 0.4rem 0.5rem;
      text-align: left;
    }

    tbody td {
      border-bottom: 1px solid #1f2c31;
      padding: 0.2rem 0.5rem;
      color: #f4f9fc;
      vertical-align: middle;
      line-height: 1.1;
      font-size: clamp(1rem, 1.72vw, 2.1rem);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.022); }

    tbody tr.incomplete td { color: #8ea3ae; }

    .c-rank { width: 8%; text-align: center; font-family: "Oswald", sans-serif; font-weight: 600; }
    .c-name { width: 30%; font-weight: 600; }
    .c-club { width: 20%; color: #c3d2da; }
    .c-grade { width: 11%; text-align: center; color: #c3d2da; }
    .c-sub { width: 10%; text-align: center; color: #d7c4ad; }
    .c-score { width: 13%; text-align: right; font-weight: 700; font-family: "Oswald", sans-serif; }
    .c-inners { width: 10%; text-align: right; color: #d7c4ad; font-family: "Oswald", sans-serif; }

    .rank-1 { color: var(--gold); }
    .rank-2 { color: var(--silver); }
    .rank-3 { color: var(--bronze); }

    .tie {
      font-size: 0.62em;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-left: 0.15rem;
    }

    .incomplete-tag {
      font-family: "Oswald", sans-serif;
      font-size: 0.62em;
      letter-spacing: 0.1em;
      color: #9aa9b2;
      border: 1px solid #33424a;
      border-radius: 4px;
      padding: 0.08rem 0.4rem;
    }

    .empty-state {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      font-family: "Oswald", sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: clamp(1rem, 1.4vw, 1.5rem);
    }

    .footer {
      border-top: 1px solid #3a3128;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.42rem 1rem;
      min-height: 52px;
    }

    .footer img {
      height: 30px;
      width: auto;
      opacity: 0.94;
    }

    @media (max-height: 800px) {
      .app { padding: 0.6rem 1rem 0.5rem; gap: 0.5rem; }
      .club-brand img { max-height: 52px; }
      tbody td { padding: 0.14rem 0.45rem; }
      .footer { min-height: 42px; }
      .footer img { height: 24px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="top-row">
      <div class="club-brand">
        <img src="assets/hrc-logo.svg" alt="Howick Rifle Club logo">
      </div>
      <div class="event-identity">
        <div id="event-title" class="event-title">Championship Results</div>
        <div id="event-format" class="event-format">Waiting for first update...</div>
      </div>
      <div class="status">
        <div><span id="state-badge" class="state-badge">--</span></div>
        <div id="published-label">Published: -</div>
        <div id="warning-label" class="warning">Connection warning: showing last published results</div>
      </div>
    </section>

    <section class="view-row">
      <div id="view-title" class="view-title">-</div>
      <div class="view-meta">
        <span id="page-label"></span>
        <span id="view-dots" class="dots"></span>
      </div>
    </section>

    <section class="board">
      <table id="results-table">
        <thead id="results-head"></thead>
        <tbody id="results-body"></tbody>
      </table>
      <div id="empty-state" class="empty-state" style="display:none">Waiting for published results</div>
    </section>
  </main>

  <footer class="footer">
    <img src="assets/rangehub-logo.svg" alt="RangeHub">
  </footer>

  <script>
    (function () {
      'use strict';

      var DEFAULT_EVENT_CODE = 'championship-def-20260819041208088';
      var REFRESH_MS = 10000;
      var SCREEN_MS = 15000;
      var MAX_SUBTOTAL_COLUMNS = 2;

      var params = new URLSearchParams(window.location.search);
      var eventCode = (params.get('event') || DEFAULT_EVENT_CODE).trim();
      var dataUrl = 'live/championships/' + encodeURIComponent(eventCode) + '/results.json';

      var payload = null;
      var screens = [];
      var screenIndex = 0;
      var screenKey = null;

      var el = {
        eventTitle: document.getElementById('event-title'),
        eventFormat: document.getElementById('event-format'),
        stateBadge: document.getElementById('state-badge'),
        published: document.getElementById('published-label'),
        warning: document.getElementById('warning-label'),
        viewTitle: document.getElementById('view-title'),
        pageLabel: document.getElementById('page-label'),
        dots: document.getElementById('view-dots'),
        head: document.getElementById('results-head'),
        body: document.getElementById('results-body'),
        table: document.getElementById('results-table'),
        empty: document.getElementById('empty-state')
      };

      function rowsPerPage() {
        return window.innerHeight < 800 ? 8 : 10;
      }

      function shortCategoryName(name) {
        return String(name || '').toUpperCase();
      }

      // Rotation order: every open category first (Overall, then the stages as published),
      // then the grade views for each category in the same order. Empty views are skipped.
      function buildViews(data) {
        if (!data || !Array.isArray(data.resultCategories)) {
          return [];
        }

        var categories = data.resultCategories.slice().sort(function (a, b) {
          if (a.resultType === b.resultType) return 0;
          return a.resultType === 'OVERALL' ? -1 : 1;
        });

        var views = [];

        categories.forEach(function (category) {
          var rows = Array.isArray(category.rankings) ? category.rankings : [];
          if (rows.length === 0) return;
          views.push({
            key: category.key + '|ALL',
            title: shortCategoryName(category.name),
            category: category,
            rows: rows
          });
        });

        categories.forEach(function (category) {
          var gradeRankings = Array.isArray(category.gradeRankings) ? category.gradeRankings : [];
          gradeRankings.forEach(function (ranking) {
            var rows = Array.isArray(ranking.rankings) ? ranking.rankings : [];
            if (rows.length === 0) return;
            views.push({
              key: category.key + '|' + ranking.grade,
              title: shortCategoryName(category.name) + ' \u2014 ' + String(ranking.gradeLabel || ranking.grade).toUpperCase(),
              category: category,
              rows: rows
            });
          });
        });

        return views;
      }

      function buildScreens(views) {
        var perPage = rowsPerPage();
        var list = [];

        views.forEach(function (view) {
          var pageCount = Math.max(Math.ceil(view.rows.length / perPage), 1);
          for (var page = 0; page < pageCount; page += 1) {
            list.push({
              key: view.key + '#' + page,
              view: view,
              page: page,
              pageCount: pageCount,
              rows: view.rows.slice(page * perPage, (page + 1) * perPage)
            });
          }
        });

        return list;
      }

      function subtotalColumns(data, category) {
        if (!category || category.resultType !== 'OVERALL') return [];
        var stages = (data && data.courseOfFire && Array.isArray(data.courseOfFire.stages))
          ? data.courseOfFire.stages
          : [];
        if (stages.length === 0 || stages.length > MAX_SUBTOTAL_COLUMNS) return [];
        return stages.map(function (stage) {
          return { key: stage.key, label: stage.shots + ' Shot' };
        });
      }

      function formatTime(value) {
        if (!value) return '-';
        var date = new Date(value);
        if (isNaN(date.getTime())) return '-';
        return date.toLocaleTimeString('en-NZ', { hour: '2-digit', minute: '2-digit' }) +
          ' \u00b7 ' + date.toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' });
      }

      function renderHeader(data) {
        var event = (data && data.event) || {};
        el.eventTitle.textContent = event.title || 'Championship Results';
        el.eventFormat.textContent = [event.discipline, event.format, event.competitionType]
          .filter(Boolean)
          .join(' \u2022 ');

        var publication = (data && data.publication) || {};
        el.published.textContent = 'Published: ' + formatTime(publication.publishedAt || publication.generatedAt);
        el.stateBadge.textContent = event.status || '--';
      }

      function renderScreen() {
        var screen = screens[screenIndex];

        if (!screen) {
          el.table.style.display = 'none';
          el.empty.style.display = 'block';
          el.viewTitle.textContent = '-';
          el.pageLabel.textContent = '';
          el.dots.innerHTML = '';
          return;
        }

        el.table.style.display = '';
        el.empty.style.display = 'none';
        screenKey = screen.key;

        var subtotals = subtotalColumns(payload, screen.view.category);

        el.viewTitle.textContent = screen.view.title;
        el.pageLabel.textContent = screen.pageCount > 1
          ? 'Page ' + (screen.page + 1) + ' of ' + screen.pageCount
          : '';

        el.dots.innerHTML = '';
        if (screens.length > 1) {
          screens.forEach(function (candidate, index) {
            var dot = document.createElement('span');
            dot.className = 'dot' + (index === screenIndex ? ' on' : '');
            el.dots.appendChild(dot);
          });
        }

        var headRow = document.createElement('tr');
        var headings = [
          { label: 'Rank', className: 'c-rank' },
          { label: 'Shooter', className: 'c-name' },
          { label: 'Club', className: 'c-club' },
          { label: 'Grade', className: 'c-grade' }
        ];
        subtotals.forEach(function (subtotal) {
          headings.push({ label: subtotal.label, className: 'c-sub' });
        });
        headings.push({ label: subtotals.length ? 'Total' : 'Score', className: 'c-score' });
        headings.push({ label: 'Inners', className: 'c-inners' });

        headings.forEach(function (heading) {
          var th = document.createElement('th');
          th.className = heading.className;
          th.textContent = heading.label;
          headRow.appendChild(th);
        });
        el.head.innerHTML = '';
        el.head.appendChild(headRow);

        el.body.innerHTML = '';
        screen.rows.forEach(function (row) {
          var ranked = row.rank !== null && row.rank !== undefined;
          var tr = document.createElement('tr');
          if (!ranked) tr.className = 'incomplete';

          var rankCell = document.createElement('td');
          rankCell.className = 'c-rank';
          if (ranked) {
            var rankSpan = document.createElement('span');
            rankSpan.textContent = String(row.rank);
            if (row.rank === 1) rankSpan.className = 'rank-1';
            else if (row.rank === 2) rankSpan.className = 'rank-2';
            else if (row.rank === 3) rankSpan.className = 'rank-3';
            rankCell.appendChild(rankSpan);
            if (row.tied) {
              var tie = document.createElement('span');
              tie.className = 'tie';
              tie.textContent = '=';
              rankCell.appendChild(tie);
            }
          } else {
            rankCell.textContent = '\u2013';
          }
          tr.appendChild(rankCell);

          var nameCell = document.createElement('td');
          nameCell.className = 'c-name';
          nameCell.textContent = row.shooterName || '';
          tr.appendChild(nameCell);

          var clubCell = document.createElement('td');
          clubCell.className = 'c-club';
          clubCell.textContent = row.homeClub || '';
          tr.appendChild(clubCell);

          var gradeCell = document.createElement('td');
          gradeCell.className = 'c-grade';
          gradeCell.textContent = row.grade || '';
          tr.appendChild(gradeCell);

          subtotals.forEach(function (subtotal) {
            var cell = document.createElement('td');
            cell.className = 'c-sub';
            var match = (row.subtotals || []).filter(function (candidate) {
              return candidate.categoryKey === subtotal.key;
            })[0];
            cell.textContent = match && match.points !== null && match.points !== undefined
              ? String(match.points)
              : '\u2013';
            tr.appendChild(cell);
          });

          var scoreCell = document.createElement('td');
          scoreCell.className = 'c-score';
          if (ranked && row.points !== null && row.points !== undefined) {
            scoreCell.textContent = String(row.points);
          } else {
            var tag = document.createElement('span');
            tag.className = 'incomplete-tag';
            tag.textContent = 'Incomplete';
            scoreCell.appendChild(tag);
          }
          tr.appendChild(scoreCell);

          var innersCell = document.createElement('td');
          innersCell.className = 'c-inners';
          innersCell.textContent = (ranked && row.inners !== null && row.inners !== undefined)
            ? String(row.inners)
            : '\u2013';
          tr.appendChild(innersCell);

          el.body.appendChild(tr);
        });
      }

      function applyPayload(data) {
        payload = data;
        var previousKey = screenKey;
        screens = buildScreens(buildViews(data));

        // Hold position across refreshes so a data update never restarts the rotation.
        var matched = -1;
        for (var index = 0; index < screens.length; index += 1) {
          if (screens[index].key === previousKey) {
            matched = index;
            break;
          }
        }
        screenIndex = matched >= 0 ? matched : Math.min(screenIndex, Math.max(screens.length - 1, 0));

        renderHeader(data);
        renderScreen();
      }

      function advance() {
        if (screens.length <= 1) return;
        screenIndex = (screenIndex + 1) % screens.length;
        renderScreen();
      }

      function refresh() {
        fetch(dataUrl + '?t=' + Date.now(), { cache: 'no-store' })
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
          })
          .then(function (data) {
            el.warning.style.display = 'none';
            applyPayload(data);
          })
          .catch(function () {
            // Keep the last successful results on screen; only surface a small warning.
            el.warning.style.display = 'block';
            if (!payload) {
              el.table.style.display = 'none';
              el.empty.style.display = 'block';
              el.empty.textContent = 'Waiting for published results';
            }
          });
      }

      window.addEventListener('resize', function () {
        if (payload) applyPayload(payload);
      });

      refresh();
      setInterval(refresh, REFRESH_MS);
      setInterval(advance, SCREEN_MS);
    })();
  </script>
</body>
</html>
